services:
  alliance-admin:
    container_name: alliance-admin
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      PORT: 3100
    ports:
      - '${APP_PORT:-80}:3100'
      - '${APP_ALT_PORT:-3100}:3100'
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3100/api/health']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
