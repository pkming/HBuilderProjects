services:
  alliance-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alliance-admin
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:3100"
    environment:
      PORT: 3100
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-session-token}
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
